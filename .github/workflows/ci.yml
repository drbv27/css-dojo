name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches PRODUCTION, not the dev machine. Coolify builds this app with
          # NIXPACKS_NODE_VERSION=22, so CI validates on 22 — a gate that passes
          # on a different major than the one that actually builds and serves the
          # app does not protect the deploy.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - run: npm run test:run

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
