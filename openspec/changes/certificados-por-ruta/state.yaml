el_numero_que_definio_la_regla_Y_POR_QUE_ESTABA_MAL: >
  OJO: este parrafo justifica una regla QUE YA NO EXISTE. Se conserva porque el
  error de razonamiento vale mas que el numero. La medicion era correcta y la
  POBLACION era la equivocada: los "mejores nueve" son de COHORTE 1, que esta
  fuera de alcance. Ningun alumno de cohorte 2 puede llegar a 17 de 19, porque
  ocho de los diecinueve nunca se les habilitaron. La regla acotada a la cohorte
  resolvia el problema de una cohorte que nadie va a certificar, y a cambio
  certificaba a mitad de curso. La rechazo el instructor el 2026-08-27.
  El texto original, para que se pueda auditar el razonamiento:
  Con "100% de los ejercicios de los 19 obligatorios de CSS", medido sobre los 35
  alumnos: CERO calificarian. Los mejores nueve llegan a 134 ejercicios y 17 de
  19 modulos. Los dos que faltan son tailwind-css (29) y proyecto-cv-css (30), y
  no es por falta de esfuerzo: la cohorte 1 dejo de trabajar entre el 3 y el 12
  de julio porque se acabo el curso, y proyecto-cv-css NO TENIA doc de
  ModuleSettings, o sea que era invisible hasta que se habilito el 2026-08-25.
  Una regla que no certifica a nadie -incluidos los nueve que hicieron todo lo
  que les pusieron adelante- no es estricta: esta rota. De ahi sale la regla
  elegida: los obligatorios HABILITADOS PARA SU COHORTE.

decidido_por_el_instructor:
  - >
    La cohorte 1 queda FUERA DE ALCANCE. Fue un experimento y sus alumnos
    practicamente no vuelven a entrar. Se reconcilia despues, y el diseno de
    snapshot es lo que va a permitir otorgarles algo honesto.
  - >
    La cohorte 2 es el ESTANDAR de aca en adelante, y es la cohorte para la que
    esta pensado este cambio.
  - >
    Los certificados son POR RUTA -- css, html, js, react, react-eco, nextjs:
    los SEIS valores de DojoType. La lista original decia cinco y se olvidaba
    react-eco.
  - >
    No se emite ningun certificado hasta que todo el flujo exista. Pero es el
    destino, y todo se planifica apuntando ahi.
  - >
    CORREGIDO EL 2026-08-27, y reemplaza la opcion 1 que se habia elegido: el
    certificado exige el 100% de los ejercicios de TODOS los obligatorios del
    track, no de los habilitados para la cohorte. Que el instructor los vaya
    habilitando de a poco no achica el requisito: significa que la cohorte
    todavia no termino el curso. Lo habilitado se sigue leyendo, pero solo para
    reportar por que falta un modulo (aunNoHabilitados).
  - >
    DECIDIDO EL 2026-08-27: el certificado se otorga por ACCION DEL PROFESOR, no
    automaticamente al llegar al 100%. Consecuencia registrada en design.md: la
    vista del profesor (5.2) pasa a ser PRERREQUISITO del endpoint de
    otorgamiento, porque con accion manual el alumno queda protegido por el
    snapshot recien cuando alguien hace clic.
  - >
    DECIDIDO EL 2026-08-27: los mini-retos van ANTES del primer certificado.
    Primero la infraestructura, los certificados al final.

la_consecuencia_que_nadie_habia_costeado: >
  Certificados POR RUTA implica que la clasificacion obligatorio/opcional hace
  falta en LOS SEIS tracks, no solo CSS. Medido el 2026-08-27 contra ALL_MODULES:
  106 modulos -- css 30, js 29, react 20, html 17, react-eco 5, nextjs 5 -- y
  solo CSS tiene la clasificacion decidida, o sea 76 sin clasificar. Este
  parrafo decia CINCO tracks y 101 modulos: se olvidaba react-eco, que es un
  track vivo en el DojoSwitcher.
  La salida NO es apurar los otros cinco: es que la ausencia de `nivel` sea una
  COMPUERTA. Un track solo certifica si TODOS sus modulos declaran nivel; los
  otros cinco se niegan a certificar, que es el comportamiento correcto para una
  credencial. CSS certifica primero porque es el unico con la decision tomada.
  Y la compuerta sobrevivio al error de conteo sin cambiar una linea, porque la
  regla esta escrita sobre "todos los modulos del track" y no sobre una lista
  fija de tracks. Esa es la leccion que hay que conservar.

dependencia_conocida_YA_RESUELTA: >
  DECIDIDO EL 2026-08-27: los mini-retos entran ANTES del primer certificado.
  Ademas dejo de ser hipotetica: el commit 6822485 ya le agrego dos ejercicios a
  `unidades-css`, que es obligatorio, y movio el camino minimo de CSS de 166 a
  168 ejercicios en un commit de contenido cualquiera. El texto original:
  Los mini-retos de plan-mejoras-css.md (leccion -> challenge -> leccion ->
  challenge) VAN A AGREGAR ejercicios a modulos obligatorios. Un alumno que hoy
  esta al 100% baja del 100% el dia que eso entra. Por eso el certificado es un
  SNAPSHOT y no una consulta viva. No bloquea este cambio, pero conviene que los
  mini-retos entren -o se descarten explicitamente- ANTES de emitir el primer
  certificado, o quedan dos poblaciones con definiciones distintas.

decision_que_bloqueaba_la_fase_5_YA_TOMADA: >
  RESUELTA EL 2026-08-27: por ACCION DEL PROFESOR. La fase 5 deja de estar
  bloqueada y pasa a estar agendada para el final.

orden_de_lo_que_viene:
  - "[HECHO 2026-08-28] mini-retos de plan-mejoras-css.md"
  - >
    [HECHO 2026-08-29] fase 5.2 -- vista del profesor (PRERREQUISITO del
    endpoint). Se adelanto a los 8 modulos a pedido del instructor, y es
    correcto: los 8 condicionan CUANDO se puede otorgar el primer certificado,
    no si la vista se puede construir. El disenio ya contemplaba ese estado --
    `aunNoHabilitados` existe justamente para reportarlo -- y la vista es lo que
    le muestra al instructor cuan lejos esta cada alumno ANTES de decidir cuando
    abrirlos.
  - >
    [DISCRECIONAL DEL INSTRUCTOR] habilitar para cohorte 2 los 8 obligatorios de
    CSS que faltan (float-display, posicionamiento, flexbox, css-grid,
    variables-css, media-queries, tailwind-css, proyecto-cv-css). NO es un
    prerrequisito de nada tecnico: es el calendario del curso.
  - fase 5.1 -- endpoint de otorgamiento, teacher-only
  - fase 5.3 -- vista del alumno
  - primer certificado

fase_5_2_como_quedo:
  entregado: 2026-08-29
  superficie:
    - src/lib/certificados-panel.ts        # el roster, en lote
    - src/app/api/teacher/certificados/    # GET, teacher-only
    - src/app/(teacher)/teacher/certificados/page.tsx
  solo_lectura: >
    A proposito. Otorgar es la 5.1 y todavia no existe. La vista tiene que
    existir ANTES del boton: con otorgamiento manual nadie vigila la
    elegibilidad por el instructor, y un alumno puede llegar al 100 % y caerse
    despues sin que nadie lo haya visto.
  decisiones_del_apply:
    - >
      LEE EN LOTE, no una vez por alumno. `esElegible` es la funcion correcta
      para UN alumno y la equivocada para una lista: son 105 viajes a la base
      para una pantalla de 35. El panel hace CUATRO lecturas y despues llama a
      `elegibilidadDe`, LA MISMA funcion pura, no una segunda copia de la regla.
      Una copia que derivara mostraria un roster que no coincide con lo que el
      endpoint de otorgamiento va a hacer, y se veria como un otorgamiento que
      "misteriosamente" se niega. Hay un guard que cuenta las lecturas.
    - >
      NO se invento un umbral de "le falta poco". Se ordena por distancia y el
      instructor decide a quien mirar. La plataforma ya arrastra una regla que
      nadie eligio -el credito parcial completa a los 70- y un segundo corte
      inventado escondería alumnos detras de un numero que nadie decidio.
    - >
      `aunNoHabilitados` es columna propia. Es la diferencia entre hablar con el
      alumno y hablar con el calendario.
  lo_que_encontro_el_navegador_y_ningun_test: >
    El titular "pueden recibirlo" contaba a los que YA tienen el certificado,
    asi que prometia trabajo que no existe: el profe abria esperando dos
    personas a quienes otorgar y encontraba una. El arreglo NO fue tocar el JSX:
    el numero se movio a `ResumenDelPanel`, en la libreria, porque un numero que
    decide si alguien abre una pantalla tiene que tener un guard. Derivarlo en
    la vista lo dejaba fuera de la suite, que es exactamente como se colo.
  verificacion:
    tests: 349 en 34 archivos (eran 332 en 32)
    controles_positivos: 18, todos en rojo
    dos_tests_nacieron_VACUOS: >
      Sus controles positivos PASARON, que es la senial. "un opcional no cuenta"
      le hacia hacer el opcional al alumno, asi que exigirlo por error no movia
      el numero; y "cada cohorte lee su set" tenia UN solo alumno, cuya cohorte
      era tambien la primera, asi que heredar la de la primera daba lo mismo.
      Los dos reescritos, y sus controles ahora si se ponen rojos.
    typecheck: limpio
    lint: 0 errores, 50 warnings -- las mismas 50 que ya tiene main
    build: ok, /teacher/certificados en la tabla de rutas
    a_ojo: >
      Verificado en el navegador contra la base de QA sembrada con los cuatro
      estados (elegible, ya certificado, atrasado, esperando modulos sin abrir),
      mas la rama de una ruta que no certifica.

next_recommended: fase 5.1 -- el endpoint de otorgamiento, ahora que su prerrequisito existe
