change: automated-gates
created: 2026-08-03
artifact_store: hybrid

session_preflight:
  execution_mode: interactive
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  review_budget_lines: 400

relates_to:
  - change: loader-moderno-dojo
    relation: blocks
    reason: >
      The user chose to establish gates BEFORE implementing the loader, so the
      loader change can run under strict TDD against its already-written
      Given/When/Then spec (8 requirements, 15 scenarios). loader-moderno-dojo
      is planned through tasks and is on hold at apply.
    collision: >
      src/components/landing/Landing3D.tsx:32 already fails
      react-hooks/set-state-in-effect (error). That file is one of the three
      loader-moderno-dojo modifies, and its design adds more state to the same
      component. Ownership of this fix must be assigned before either applies.

phases:
  explore:
    status: done
    artifact: openspec/changes/automated-gates/exploration.md
    engram_topic_key: sdd/automated-gates/explore
    agent_status_was: partial
    orchestrator_completed: >
      The sdd-explore agent had no Bash or Write tool, so it executed nothing and
      wrote nothing. The orchestrator wrote exploration.md, then verified the
      agent's claims by execution and CORRECTED TWO of them.
    orchestrator_verified:
      - >
        CORRECTION: eslint-config-next IS installed. The agent reported it
        "declared but NOT installed". node_modules/eslint-config-next exists,
        with flat-config subpath exports ./core-web-vitals, ./typescript,
        ./parser confirmed in its package.json. There is NO npm install
        prerequisite.
      - >
        CORRECTION: `npm run build` WORKS — executed, exit 0, full route
        manifest, no MONGODB_URI required. The agent could only infer this.
      - >
        `npx tsc --noEmit` WORKS and currently passes CLEAN (exit 0). tsconfig
        already has strict and noEmit. A typecheck gate is one package.json line
        away and passes today.
      - >
        Lint backlog MEASURED by writing the flat config temporarily, running
        `npx eslint . -f json`, then deleting it (repo left unchanged):
        46 errors, 21 warnings, 41 of 243 files, only 3 auto-fixable.
        35 of the 46 errors are @typescript-eslint/no-explicit-any.
        8 are react-hooks/set-state-in-effect, the one non-stylistic group.
      - >
        src/components/landing/ is lint-clean EXCEPT Landing3D.tsx:32
        (set-state-in-effect, error) and Personaje.tsx:49/57
        (preserve-manual-memoization error, exhaustive-deps warn).
        Loader.tsx itself is clean.
      - >
        Scenario classification independently refined by the agent and accepted:
        13 of 15 landing-loader scenarios are jsdom-testable (10 plain, 2 needing
        a getContext stub plus an Escena module mock, 1 with a framer-motion
        timing caveat), 1 is E2E-only (the real .glb 404 through a real Canvas),
        and 1 is not a runtime test at all (out-of-scope-files-untouched is a
        git diff check).
  propose:
    status: done
    artifact: openspec/changes/automated-gates/proposal.md
    engram_topic_key: sdd/automated-gates/proposal
    recommendation: >
      TWO stacked PRs to main. Slice 1 "gate on, errors cleared": eslint flat
      config, typecheck script, no-explicit-any downgraded to warn, all 8
      set-state-in-effect fixes, plus the trivial errors (95-145 lines).
      Slice 2 "test tiers": Vitest infra, xp.ts suite, Playwright infra, one
      green smoke E2E (170-240 lines). Rationale: the aggregate 266-381 lines
      leaves as little as 19 lines of headroom, and more importantly it mixes
      uncovered behavioural refactors of live components with purely additive
      tooling. chained-pr's gate is review focus, not raw size.
    orchestrator_verified:
      - >
        ARITHMETIC GAP CONFIRMED. 46 errors = 35 no-explicit-any + 8
        set-state-in-effect + 1 prefer-const + 2 preserve-manual-memoization.
        The four user decisions covered 44. The 2 preserve-manual-memoization
        errors were unassigned, so "lint exits 0" was not achievable as decided.
        Locations: src/app/(app)/modulos/[slug]/ejercicio/[exerciseId]/page.tsx:49
        and src/components/landing/Personaje.tsx:49. The prefer-const is at
        src/components/editor/CodeBlock.tsx:100.
      - >
        NO CI AND NO HOOK MANAGER CONFIRMED. No .github/, .husky/,
        .gitlab-ci.yml, .circleci/, or .pre-commit-config.yaml. The only YAML
        files in the repo are the openspec artifacts created in this session.
        Consequence: any gate scripts this change adds are runnable but never
        enforced automatically.
      - >
        Playwright cannot ship a green test for landing-loader scenario 4.2 in
        this change — the error state it asserts does not exist until
        loader-moderno-dojo is implemented, and user decision 2 puts loader
        tests RED-first in that change's own apply. Accepted reconciliation:
        runner plus one green landing smoke test here; 4.2's spec authored
        during the loader's apply. Decision 4 is honoured, nothing dropped.
    user_decisions:
      lint_backlog_scope: gate-plus-hooks-errors
      lint_backlog_detail: >
        Turn the gate on, FIX all 8 react-hooks/set-state-in-effect errors
        (cascading-render risk, the one non-stylistic group), and downgrade
        @typescript-eslint/no-explicit-any to warning with a follow-up issue for
        the 35 occurrences. Do not type 35 anys in this change.
      loader_test_sequencing: option-a-red-first-in-loader-change
      loader_test_detail: >
        This change ships infra plus tests for existing pure logic (src/lib/xp.ts).
        The 13 jsdom-testable landing-loader tests are written RED-first during
        loader-moderno-dojo's own apply, against its already-written spec. Keeps
        main green and keeps strict TDD honest.
      landing3d_collision_owner: automated-gates
      landing3d_collision_detail: >
        This change fixes Landing3D.tsx:32 alongside the other 7 of its family,
        before loader-moderno-dojo touches the file. The loader change then
        starts from a lint-clean base and does not mix hooks-debt repair with a
        loader redesign.
      e2e_tier: playwright-now
      e2e_detail: >
        User chose to add Playwright in THIS change, against the orchestrator's
        recommendation to defer. The orchestrator's stated concern — it formally
        covers 1 of 15 scenarios at the cost of browser binaries, CI time, and a
        second runner to maintain — was communicated and the user reaffirmed.
        Proceed with the full request.
    orchestrator_decisions:
      - >
        ExerciseRenderer validation extraction is OUT of this change. It is a
        refactor of a live component and is not needed to prove the harness —
        src/lib/xp.ts does that with pure functions and zero coupling.
    size_warning: >
      With Playwright included, rough estimate is 250-350 changed lines against
      the 400-line budget — close to the ceiling. Under delivery_strategy
      ask-on-risk the proposal MUST assess explicitly whether this warrants two
      slices, and the tasks phase must produce a Review Workload Forecast that
      the orchestrator checks before apply.
  spec:
    status: done
    artifacts:
      - openspec/changes/automated-gates/specs/automated-verification-gates/spec.md
      - openspec/changes/automated-gates/specs/xp-progression/spec.md
    engram_topic_key: sdd/automated-gates/spec
    summary: >
      automated-verification-gates: 7 requirements, 15 scenarios.
      xp-progression: 4 requirements, 13 scenarios. Total 11 / 28.
  design:
    status: done
    artifact: openspec/changes/automated-gates/design.md
    engram_topic_key: sdd/automated-gates/design
    summary: >
      Slice 1: AST-only ESLint flat config (core-web-vitals + typescript + one
      no-explicit-any -> warn override); all 11 errors cleared by deriving state
      during render, moving writes to the causing event, or reading the browser
      via useSyncExternalStore. Slice 2: Vitest+jsdom with the xp.ts suite,
      chromium-only Playwright with one hydration-proving landing smoke test,
      and one sequential GitHub Actions job.
    revised_estimates:
      slice_1_lines: 175-195
      slice_1_supersedes: "proposal forecast of 95-145"
      slice_1_driver: GameEngine.tsx
      slice_2_lines: 190-220
      budget_risk: low
      note: Neither slice breaches 400 on its own; the un-split aggregate would have.
    orchestrator_verified:
      - >
        CONFIRMED BUG in src/lib/xp.ts:49. `const normalized = score > 1 ?
        score / 100 : score` — a raw score of 1 is NOT > 1, so it normalizes to
        1.0 and is clamped to full XP. The comment on line 48 says "score comes
        as 0-100 from exercises", meaning score=1 represents 1% and should award
        almost nothing. It awards 100%. The function tries to accept both 0-100
        and 0-1 ranges and the ambiguity bites exactly at 1. Found by sdd-spec,
        independently confirmed by the orchestrator.
      - >
        DESIGN'S RESIDUAL GAMEENGINE RISK CLOSED — does not materialize. The
        design flagged that if any level's initialCSS already satisfied its own
        validateFn, deriving `solved` during render would show it solved but
        never record completion. Checked all 50 levels across
        src/data/games/flexbox-levels.ts and grid-levels.ts: 31 have an empty
        initialCSS and the 18 non-empty ones (flexbox ids 17,18,19,20,22,24;
        grid ids 11,13,14,15,16,18,19,20,22,23,24) each still require at least
        one unsatisfied token. NONE starts pre-solved. Caveat: this used a
        whitespace-normalized substring containment check, not a replication of
        GameEngine's real validator — strong evidence, not formal proof.
      - >
        The design verified `react-hooks/set-state-in-effect` scans ONLY the
        effect function's own basic blocks
        (eslint-plugin-react-hooks/cjs/...production.js:50667-50789), which is
        why GameEngine.tsx:96's setTimeout(() => setShowSuccess(true)) was never
        flagged. This is the load-bearing fact behind all 8 hooks fixes and was
        read from installed source, not assumed.
    accepted_behaviour_deltas:
      - >
        Landing3D: the WebGL/media probe becomes cached per page load, so
        crossing the 767px breakpoint and client-navigating back to / keeps the
        earlier decision until a reload. Today it re-probes per mount. Accepted
        as a minor, acceptable delta.
      - >
        Leaderboard: a failed refetch now shows the empty state instead of the
        previous filter's rows. Accepted.
    user_decisions_round_2:
      nueva_contrasena_behaviour_change: accepted
      nueva_contrasena_detail: >
        User granted the explicit exception to the behaviour-preservation
        requirement. The offline retry loop against the OTP endpoint is a bug
        with abuse-surface smell, not behaviour worth preserving. Event-driven
        verification replaces it; users must edit a digit to retry. MUST be
        documented in the PR body, not only in the diff, and the full reset flow
        MUST be exercised end to end before slice 1 merges.
      calculate_xp: delete
      calculate_xp_detail: >
        REVISED after new evidence. The user first chose "fix it in slice 2",
        then the orchestrator verified that `calculateXP` has ZERO callers
        anywhere in src/ — the real XP award path is
        src/app/api/progress/route.ts using `exercise?.xpReward ?? 10` and never
        touches it. The score=1 bug is latent and never fires. Presented with
        that, the user chose DELETE. One line of diff, removes the bug without
        argument, and avoids testing dead code.
      mobilenav_getrank: include-fix
      mobilenav_detail: >
        Investigated at the user's request, then approved. MobileNav.tsx:69 is
        `const rank = getRank(0)` with a hardcoded zero, and that rank IS
        consumed at line 179. `user` is already in scope at line 66 and used at
        line 68. MobileMenu.tsx:72 does it correctly as
        `getRank(user?.xp ?? 0)`, consumed at 193-196. So every mobile user sees
        the 0-XP rank in the nav drawer while the menu shows the correct one —
        a real user-visible bug. Fix is one line with an exact sibling
        precedent, in a file slice 1 already modifies for the
        set-state-in-effect fix at line 73.
    spec_drift_to_resolve: >
      specs/xp-progression/spec.md currently contains a calculateXP requirement
      with scenarios describing the score=1 behaviour. Deleting calculateXP makes
      that requirement wrong. The tasks phase MUST include an explicit task to
      update that spec — replace the calculateXP requirement with a removal
      requirement — so verify does not fail on artifact inconsistency. Test
      coverage concentrates on getRank, getNextRank, and getXPProgress, which are
      imported across 9 files (dashboard, perfil, leaderboard, Sidebar,
      SidebarXP, MobileNav, MobileMenu, teacher pages).
    downstream_coupling: >
      CORRECTED. loader-moderno-dojo's design.md cites Landing3D.tsx
      "lines 27-35" and `onOmitirEscena={() => setModo("estatica")}`. An earlier
      version of this note said the escape "becomes setOmitirEscena(true) — one
      token". THAT IS WRONG and was written before the speculative state was
      removed. There is NO escape-hatch state in the shipped Landing3D.tsx —
      `modo` is a plain ternary over `capaz3D`, and `omitirEscena` has zero
      occurrences in src/. loader-moderno-dojo must ADD its own state and fold
      it into that derivation. Line citations also shifted. That change's apply
      MUST rebase on merged slice 1 and re-read the file.

  tasks:
    status: done
    artifact: openspec/changes/automated-gates/tasks.md
    engram_topic_key: sdd/automated-gates/tasks
    summary: >
      3 phases, 51 checkbox tasks. Slice 1 splits into three commits:
      chore(lint) trivial cleanup, fix(hooks) for 5 low-risk components plus the
      2 memoization fixes, and refactor(games) isolating GameEngine.tsx alone.
      Slice 2 covers test infra, the xp.ts suite, the calculateXP deletion, the
      mandatory spec-drift correction, Playwright, and GitHub Actions.
      Phase 3 is the loader-moderno-dojo handoff.
    review_workload_forecast:
      slice_1:
        estimated_changed_lines: 175-197
        chained_prs_recommended: true
        budget_risk: low
        decision_needed_before_apply: false
        driver: GameEngine.tsx
      slice_2:
        estimated_changed_lines: 190-220
        chained_prs_recommended: true
        budget_risk: low
        decision_needed_before_apply: false
        note: already excludes the dropped calculateXP tests, includes ~30 lines of CI YAML
    guard_outcome: >
      Review Workload Guard: both slices report budget risk Low and
      "Decision needed before apply: No". Chained PRs ARE recommended, but the
      two-slice split is the already-agreed plan rather than a surprise, so
      under ask-on-risk there is no size decision left to make. The one item the
      workflow still requires is explicit collection of chain_strategy.
    orchestrator_verified:
      - >
        Task count is 51 checkboxes, not the 71 the sdd-tasks agent reported.
        Corrected here.
      - >
        GameEngine.tsx is correctly isolated at 1.4 as its own sequential,
        separately revertable commit with a 9-step manual QA script, and
        explicitly not parallelized with 1.3.
      - >
        The mandatory spec-drift task exists at 2.4, is marked MANDATORY,
        depends on 2.3 (the calculateXP deletion), and requires landing in the
