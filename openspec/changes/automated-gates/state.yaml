  findings_resolution:
    - finding: >
        CRITICAL 1 — R6 scenario "Leaderboard filter still refreshes rankings"
        had zero coverage of any kind.
      resolution: >
        CLOSED by browser automation against the isolated database. Clicking the
        CSS filter fired exactly 1 GET /api/leaderboard?dojo=css. Three rapid
        successive clicks (JS -> React -> HTML) fired only ONE request, for the
        LAST filter, and the view settled on "Sin actividad en HTML" — no race,
        no stale rows, no hanging skeleton. Additionally verified the accepted
        behaviour delta: with fetch stubbed to reject, switching to CSS showed
        the empty state ("Sin actividad en CSS") rather than the previous
        filter's rows, with no hanging skeleton.
    - finding: >
        CRITICAL 2 — R6 scenario "Mobile drawers still auto-close on navigation"
        had zero coverage.
      resolution: >
        CLOSED by browser automation at a 390x844 viewport. Opening the drawer
        set document.body.style.overflow = "hidden" (scroll lock engaged).
        Navigating via a drawer nav link to /leaderboard cleared it to "" and
        moved the panel off-canvas (close button measured at x = -57, outside the
        viewport). Note: a DOM-presence check is the WRONG test here — the panel
        stays mounted and slides out — position plus the overflow flag are the
        correct signals.
    - finding: >
        CRITICAL 3 — task 3.1 and design.md instructed loader-moderno-dojo to
        wire `setOmitirEscena(true)`, which does not exist in the shipped code.
      resolution: >
        CLOSED. This inconsistency was created by the orchestrator's own removal
        of the speculative state. Corrected in design.md (with an explicit
        correction note), tasks.md task 3.1, tasks.md task 1.5.3 (which claimed a
        now-nonexistent lint warning), and state.yaml's downstream_coupling.
        All four now state plainly that NO escape-hatch state exists and that
        loader-moderno-dojo must add its own.
    - finding: >
        CRITICAL 4 — commit 55f267f's message claimed it "Adds an `omitirEscena`
        state", but the content had been amended to remove it.
      resolution: >
        CLOSED. Exactly the defect class the orchestrator had criticised in the
        GameEngine commit, committed by the orchestrator itself. Fixed by
        rewriting slice 1's history: the message now reads "No escape-hatch state
        is added here: `modo` is a plain ternary over `capaz3D`." Content
        unchanged — trees verified identical.
  gates_after_rewrite:
    typecheck: "exit 0"
    lint: "exit 0 — 50 problems, 0 errors, 50 warnings"
    unit_tests: "exit 0 — 18/18"
    note: Re-run by the orchestrator after the history rewrite and rebase.
  remaining_open:
    - >
      RESOLVED — both branches pushed and both PRs opened.
      PR #1: feat/automated-gates-slice-1 -> main
      (https://github.com/drbv27/css-dojo/pull/1).
      PR #2: feat/automated-gates-slice-2 -> feat/automated-gates-slice-1, stacked
      (https://github.com/drbv27/css-dojo/pull/2). PR #2 must be retargeted to
      main once #1 merges.
    - >
      RESOLVED — Task 2.7.5. The CI workflow EXECUTED on a real runner and
