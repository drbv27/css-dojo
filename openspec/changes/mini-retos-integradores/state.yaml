decidido_por_el_instructor:
  - UN reto integrador por MODULO, no uno por leccion.
  - >
    Convive con los ejercicios que ya existen. NO se toca ninguno: hay 5349
    ejercicios completados en produccion y renumerar o reescribir invalidaria
    trabajo real de alumnos.
  - >
    La solucion se muestra SOLO al completar el reto. Es la desviacion
    deliberada de W3Schools, que la deja visible desde que carga la pagina.
  - Arranca por los 19 obligatorios; los 11 opcionales van despues, aparte.
  - XP = el doble del mas alto del modulo. Medido: da 60 en 17 de los 19.
  - >
    Cuenta para el certificado, como cualquier ejercicio de un obligatorio.
    Sube el camino minimo de 168 a 187 ejercicios.
  - >
    COMPONENTE NUEVO, no un live-editor mas: instrucciones numeradas visibles al
    costado del editor, y una correccion que dice CUAL de los pasos falta, no
    solo que la respuesta esta mal.
  - >
    Los cinturones quedan FUERA de este cambio y van como cambio propio. Ver
    defecto_encontrado_QUE_NO_ES_DE_ESTE_CAMBIO.

el_error_que_origino_este_cambio: >
  Un intento anterior leyo la seccion 5 del plan -la tabla de esfuerzo, que dice
  "intercalar" y "0 modulos nuevos"- y la trato como la definicion. La
  definicion esta en la seccion 2: "un desafio chico y autocorregido despues de
  cada leccion". Se construyo una redistribucion de los ejercicios existentes en
  vez de contenido nuevo. PR #38, cerrada sin mergear.
  LA REGLA: un resumen o una tabla de esfuerzo NO es la definicion de un
  feature. Citar el parrafo que define el QUE, no el que estima el COSTO.

correccion_de_un_riesgo_MAL_MEDIDO: >
  Una version anterior de este registro decia que el cambio sube de cinturon a
  alumnos "por trabajo que no hicieron", con un salto de XP del 34%. LAS DOS
  MITADES ESTABAN MAL.
  Agregar ejercicios no le da XP a nadie retroactivamente: el XP de un alumno es
  la suma de lo que completo, y un ejercicio nuevo vale 0 hasta que lo hace.
  NADIE cambia de cinturon y el leaderboard no se mueve. Y el 34% era contra el
  camino obligatorio de CSS; contra el curriculum entero son +7.7%
  (14750 -> 15890 XP sobre 106 modulos).
  La consecuencia real de este cambio en XP es que sube el techo, nada mas.

defecto_encontrado_QUE_NO_ES_DE_ESTE_CAMBIO: >
  Los umbrales de cinturon son numeros absolutos, asi que cada vez que crece el
  curso se abaratan SOLOS. Medido: Gran Maestro pide 11000 de los 14750
  disponibles, o sea el 74.6% del curriculum entero de seis tracks, y estos 19
  retos solos lo bajan a 69.2%. Las Fases 1-3 de plan-mejoras-css.md lo bajarian
  otra vez sin que nadie lo decida.
  El arreglo durable seria anclar cada cinturon a una FRACCION del XP disponible
  en vez de a un numero fijo. Trae su propio peligro: un umbral recalculado
  puede BAJAR de cinturon a un alumno el dia que entra contenido, asi que el
  rango tendria que no retroceder nunca.
  Toca los seis tracks y a todos los alumnos existentes. FUERA DE ALCANCE aca
  por decision de Diego el 2026-08-27; va como cambio propio.

hallazgo_que_abarata_el_componente: >
  `compararReglas` en src/lib/cssRules.ts YA devuelve
  { correct, score, faltantes: string[] }, con `faltantes` en formato
  "selector { declaracion }". O sea que el grader YA sabe que falta y ya da
  credito parcial. Lo que no existe es AGRUPAR eso en pasos numerados.
  El componente no necesita motor de correccion nuevo: necesita declarar los
  pasos y mapear cada uno a sus reglas esperadas, corriendo el comparador que ya
  esta. Eso cambia el tamano del trabajo.

LA_DECISION_QUE_EL_DISENIO_LEVANTA_Y_NO_RESUELVE: >
  La ruta completa un ejercicio con `score >= 70`. En un reto de cuatro pasos,
  tres de cuatro son 75: COMPLETA con un paso entero salteado, en el ejercicio
  cuyo punto es hacer las partes juntas, y que cuenta para el certificado.
  Y no es nuevo. Medido el 2026-08-28 sobre los 77 ejercicios `css-rules` del
  curriculum: 56 DE 77 YA COMPLETAN con una declaracion faltante. El de 17
  declaraciones completa con cinco menos. "El credito parcial completa" es la
  regla vigente de la plataforma, y nadie la eligio: salio de un umbral fijo de
  70 chocando con un score proporcional.
  Recomendacion: el reto exige TODOS sus pasos -- `calificar` devuelve 100 o 0
  para un reto, nunca una fraccion. El detalle por paso igual le llega al alumno
  por el feedback, asi que no se pierde nada en la interfaz.
  LO QUE QUEDA PARA DIEGO: si la regla del 70 tiene que cambiar para los otros
  788. Es una pregunta de producto con 56 ejercicios detras y va en su propio
  cambio. NO se cuela aca.

