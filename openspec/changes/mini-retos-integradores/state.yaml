lo_que_encontro_diego_a_ojo_y_ningun_test: >
  1. El paso 4 de unidades-css decia "dale al h1" y esperaba `.hero h1`. Su
     respuesta funcionaba en el preview y el corrector la rechazaba. Salio el
     guard "todo paso que estrena un selector lo nombra".
  2. Faltaba poder VER el HTML: el alumno estaba aplicando CSS a un marcado que
     no conocia. Ahora hay una pestaña de solo lectura sobre la vista previa, y
     el reto de pseudo-elementos la usa para enseñar.
  3. El reto de Tailwind abria con el editor en modo CSS -Monaco subrayaba HTML
     valido en rojo- y la vista previa mostraba la plantilla en vez de su
     trabajo. Ningun test cubria un reto de estructura.
  Y el titulo decia "Ejercicio 9", que no le daba el peso que un reto merece.
  Ahora dice "Mini reto" en los tres lugares donde aparece.

la_leccion_mas_incomoda: >
  Arreglando el punto 3, al revertir el arreglo para verificar que el test lo
  cazara, EL TEST SIGUIO EN VERDE: el mock de LivePreview era un `<div />` que
  ignoraba sus props, asi que un preview cableado a la plantilla pasaba igual.
  UN MOCK QUE IGNORA SUS PROPS ES UN GUARD VACUO CON OTRA ROPA. Es la tercera
  variante del mismo error en dos dias, despues del cero sin denominador y del
  guard positivo de los drag-drop.

