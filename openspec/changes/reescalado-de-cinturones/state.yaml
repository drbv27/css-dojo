change: reescalado-de-cinturones
created: 2026-09-01
artifact_store: hybrid

resumen_de_una_linea: >
  Los diez umbrales de RANKS reanclados a hitos del curriculum que se pueden
  nombrar, y un guard que hace que la proxima tanda de contenido ROMPA un test
  en vez de abaratar los cinturones en silencio.

