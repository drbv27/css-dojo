change: revalidacion-en-servidor
created: 2026-08-28
artifact_store: hybrid

session_preflight:
  execution_mode: interactive
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  review_budget_lines: 800
  note: Cacheado de la sesion del 2026-08-27; no se vuelve a preguntar.

resumen_de_una_linea: >
  Corregir la respuesta del alumno EN EL SERVIDOR antes de escribir Progress, en
  vez de creerle el score que manda el navegador. 785 de 789 ejercicios.

por_que_es_urgente: >
  `POST /api/progress` hace `const isCompleted = score >= 70` con el score que
  viene en el body, y no hay UN SOLO corrector llamado en todo src/app/api/. Un
  `fetch` desde la consola de un alumno logueado completa cualquier ejercicio.
  Hasta el 2026-08-27 el dano era XP y un cinturon. Desde que aterrizo
  `certificados-por-ruta`, la elegibilidad se define sobre
  `Progress.completed === true`: un alumno puede otorgarse el certificado entero
  desde la consola. Es una credencial que firma Diego.

lo_que_este_cambio_NO_arregla: >
  Todas las respuestas del curso YA estan en el navegador. Medido en
  .next/static/chunks/04xlc4ayw5o2e.js: 154 `isCorrect`, 80 `targetCSS` y los
  `referenceSolution` que ya existen, porque la pagina del ejercicio es
  "use client" e importa ALL_MODULES entero.
  Este cambio no cierra eso y no debe pretenderlo. Cierra otra cosa y mas
  importante: MANDAR UNA COMPLETITUD QUE NO SE GANO. Leer la respuesta sigue
  exigiendo pegarla y que te corrijan.

