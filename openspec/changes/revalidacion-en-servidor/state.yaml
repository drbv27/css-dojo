      Verificado SOBRE EL ARBOL MERGEADO (main en 3ef0978, en sync con origin),
      no sobre una rama. 332 tests en 32 archivos, typecheck limpio, 804 de 808
      ejercicios corregidos por el servidor.
      Mapear la spec contra la suite encontro DOS requisitos sin guard: que un
      fallo escribiendo la discrepancia no le cueste el progreso al alumno, y
      que un tipo de validacion que nadie implemento no otorgue nada -esta
      ultima es la rama que el guard de curriculum NO PUEDE alcanzar, porque
      corre sobre los ejercicios que existen. Los dos guards se escribieron.
      Cinco controles positivos, los CINCO en rojo. `calificar.ts` y `route.ts`
