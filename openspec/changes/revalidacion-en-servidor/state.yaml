    note: >
      Archivado EN SU LUGAR: la carpeta no se mueve, porque mover la carpeta
      rompe la revision acotada -- el diff no detecta el renombre.
      La compuerta de archive avisa cuando un cambio toca auth, modelos de Mongo
      o logica de XP. Este toca los tres, y se reviso en vez de eximirse: el
