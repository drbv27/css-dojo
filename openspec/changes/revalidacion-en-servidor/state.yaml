decidido_por_el_instructor:
  - >
    Los 4 de `js-behavior` siguen corrigiendose en el cliente, MARCADOS COMO
    TALES en el codigo y en el doc. Corren el JS del alumno en un Worker y no
    hay equivalente server-side sin meter un sandbox de ejecucion en el backend.
    El track js no declara nivel, asi que no certifica: hoy no tocan ninguna
    credencial. SI ALGUN DIA SE CLASIFICA EL TRACK JS, esto pasa a ser un
    bloqueante de esa clasificacion, y va en ese cambio, no en este.
  - >
    `jsdom` se promueve de devDependency a dependency. Ya esta instalado
    (^30.0.1) y ya lo usan los tests. Sube html-structure a server-graded, y el
    track html SI va a certificar cuando se lo clasifique.
  - >
    Los 5349 Progress completados bajo la regla vieja se DEJAN COMO ESTAN.
    Recorregirlos seria una escritura masiva contra la base viva, y un bug del
    recorrector borraria trabajo legitimo de alumnos: mucho peor que dejar pasar
    una trampa improbable.
  - >
    Cuando el score del cliente y el del servidor no coincidan, MANDA EL
    SERVIDOR y la discrepancia se registra. El motivo de registrar no es solo la
    trampa: un patron de discrepancia amplio y parejo es evidencia de que el
    corrector esta mal, no los alumnos. Sin el registro, una regresion del
    corrector se ve identica a una ola de trampas, y lo primero que haria
    cualquiera es acusar a los alumnos.

riesgo_principal: >
  Un corrector de servidor MAS ESTRICTO que el del cliente rechaza en silencio a
  alumnos honestos, y se lee como error del alumno. `compararReglas` es la misma
  funcion en los dos lados, asi que css-rules esta cubierto. El peligro esta en
  `exact`: son 674 ejercicios, y cualquier normalizacion que haga el cliente y
  no haga el servidor se convierte en un rechazo falso.
  LA SPEC TIENE QUE EXIGIR un guard de datos que corra la respuesta correcta
  registrada de CADA UNO de los 789 contra el corrector del servidor y saque
  100. Misma forma que el guard de referenceSolution que ya lleva js-behavior.

bloquea_a: mini-retos-integradores

next_recommended: spec
